      .accent { fill: #6b1818; }
      .rule { stroke: #d6d2c5; stroke-width: 1; }
      .rule-soft { stroke: #ebe7d8; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630"/>

  <!-- Top wordmark + tag -->
  <text x="80" y="80"
