  <line class="rule-soft" x1="80" y1="108" x2="1120" y2="108"/>

  <!-- Eyebrow tag -->
  <text x="80" y="190"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="16"
